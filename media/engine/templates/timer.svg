<svg xmlns="http://www.w3.org/2000/svg" width="300" height="110" viewBox="0 0 300 110">
<!-- template: { size: [300, 110], params: { seconds: number (animate it) }, place: { area: hud-top-right } } -->
  <rect x="0" y="0" width="300" height="110" rx="18" fill="#000000" fill-opacity="0.55"/>
  <circle cx="60" cy="55" r="26" fill="none" stroke="{{colour.accent}}" stroke-width="7"/>
  <line x1="60" y1="55" x2="60" y2="38" stroke="{{colour.text}}" stroke-width="6" stroke-linecap="round"/>
  <text x="270" y="76" text-anchor="end" font-family="{{font.family}}" font-weight="900" font-size="60" fill="{{colour.text}}">{{seconds|time}}</text>
</svg>
