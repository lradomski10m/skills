<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<!-- template: { size: [1000, 520], params: { text: text, subtitle: "text, optional" }, place: { area: center } } -->
  <rect x="0" y="0" width="1000" height="520" rx="36" fill="{{colour.background}}" fill-opacity="0.82"/>
  <rect x="0" y="0" width="14" height="520" rx="7" fill="{{colour.accent}}"/>
  <text x="70" y="250" font-family="{{font.family}}" font-weight="900" font-size="84" fill="{{colour.text}}" data-fit-width="860">{{text|upper}}</text>
  <text x="72" y="340" font-family="{{font.family}}" font-weight="500" font-size="42" fill="{{colour.muted}}" data-fit-width="860">{{subtitle|default:}}</text>
</svg>
