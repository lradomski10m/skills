<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110">
<!-- template: { size: [360, 110], params: { value: number (animate it), prefix: "text, optional", suffix: "text, optional" }, place: { area: hud-top-right } } -->
  <rect x="0" y="0" width="360" height="110" rx="18" fill="#000000" fill-opacity="0.55"/>
  <text x="330" y="76" text-anchor="end" font-family="{{font.family}}" font-weight="900" font-size="64" fill="{{colour.text}}">{{prefix|default:}}{{value|int}}{{suffix|default:}}</text>
</svg>
